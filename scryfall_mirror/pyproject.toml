[project]
name = "scryfall-mirror"
version = "0.1.0"
description = "Downloads Scryfall's daily card, rulings and Tagger tag files and loads them into a local SQLite database for the Deckbuilder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
scryfall-mirror = "scryfall_mirror.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scryfall_mirror"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP006", "UP007"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["scryfall_mirror"]
