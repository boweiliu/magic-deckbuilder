[program:goldfish]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project .external_worktrees/magic-deckbuilder/child-apps/goldfish && uv sync --locked --project .external_worktrees/magic-deckbuilder/child-apps/goldfish && python3 system/scripts/forward_port.py --manifest .external_worktrees/magic-deckbuilder/child-apps/goldfish/app.toml --url http://localhost:8098 && exec .external_worktrees/magic-deckbuilder/child-apps/goldfish/.venv/bin/goldfish"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/goldfish-stdout.log
stderr_logfile=/var/log/supervisor/goldfish-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
