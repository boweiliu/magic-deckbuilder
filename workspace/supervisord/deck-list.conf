[program:deck-list]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project .external_worktrees/magic-deckbuilder/deck_list && uv sync --locked --project .external_worktrees/magic-deckbuilder/deck_list && python3 system/scripts/forward_port.py --manifest .external_worktrees/magic-deckbuilder/deck_list/app.toml --url http://localhost:8081 && exec .external_worktrees/magic-deckbuilder/deck_list/.venv/bin/deck-list"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/deck-list-stdout.log
stderr_logfile=/var/log/supervisor/deck-list-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
