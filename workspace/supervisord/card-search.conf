[program:card-search]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project .external_worktrees/magic-deckbuilder/child-apps/card_search && uv sync --locked --project .external_worktrees/magic-deckbuilder/child-apps/card_search && python3 system/scripts/forward_port.py --manifest .external_worktrees/magic-deckbuilder/child-apps/card_search/app.toml --url http://localhost:8093 && exec .external_worktrees/magic-deckbuilder/child-apps/card_search/.venv/bin/card-search"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/card-search-stdout.log
stderr_logfile=/var/log/supervisor/card-search-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
